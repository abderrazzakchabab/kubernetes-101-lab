<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kubernetes 101 — Interactive Terminal Lab</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header id="app-header">
    <div class="logo">
      <span class="logo-icon">⎈</span>
      <h1>Kubernetes 101</h1>
    </div>
    <div class="header-controls">
      <span id="progress-label">Progress: 0 / 0</span>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
  </header>

  <main id="app-main">
    <!-- Sidebar: module & lesson nav -->
    <aside id="sidebar">
      <nav id="module-nav"></nav>
    </aside>

    <!-- Content area: lesson text + terminal -->
    <section id="content-area">
      <div id="lesson-panel">
        <div id="lesson-header">
          <span id="lesson-badge" class="badge"></span>
          <h2 id="lesson-title">Welcome</h2>
        </div>
        <div id="lesson-body">
          <p>Select a lesson from the sidebar to begin.</p>
        </div>
        <div id="lesson-task">
          <h3>🎯 Your Task</h3>
          <p id="task-description"></p>
          <div id="task-hint" class="hidden">
            <strong>Hint:</strong> <span id="hint-text"></span>
          </div>
          <button id="btn-check" class="btn btn-primary" disabled>Check My Work</button>
          <button id="btn-hint" class="btn btn-secondary" disabled>Show Hint</button>
          <button id="btn-reset" class="btn btn-danger">Reset Cluster</button>
          <div id="task-result" class="hidden"></div>
        </div>
      </div>
      <div id="terminal-panel">
        <div id="terminal-toolbar">
          <span class="terminal-title">🖥 Mock Terminal — simulated kubectl</span>
          <button id="btn-clear-term" class="btn btn-sm">Clear</button>
        </div>
        <div id="terminal-container"></div>
      </div>
    </section>
  </main>

  <!-- Scripts (order matters) -->
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="src/state.js"></script>
  <script src="src/data/curriculum.json.js"></script>
  <script src="src/terminal-parser.js"></script>
  <script src="src/verifier.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
